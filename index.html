<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171b26" />
    <title>Takt Planner</title>
    <link rel="icon" type="image/svg+xml" href="/Planer/favicon.svg" />
    <link rel="apple-touch-icon" href="./takt-icon-192-v5.1.0.png" />
    <link rel="manifest" href="/manifest.json" id="manifest-link" />
</head>
  <body>
    <div id="root"></div>
  <script>
    // This bootstrap deliberately lives outside the hashed app bundle. It can
    // update a stale installed PWA even when that bundle no longer exists on
    // the server after a deployment.
    if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      navigator.serviceWorker
        .register('/Planer/sw.js')
        .then((registration) => registration.update())
        .catch((error) => console.warn('[SW] Service Worker registration failed:', error));
    }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
